[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-radar"
version = "1.0.0"
description = "GEO hot-topic radar: hot lists to topic cards, compliance alerts, share of voice, audited drafts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["geo", "generative-engine-optimization", "trendradar", "hot-list", "content-ops"]
dependencies = []

[project.optional-dependencies]
# psycopg is only needed when the evidence / product databases are used.
postgres = ["psycopg>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
geo-radar = "geo_radar.cli:main"

[tool.setuptools.packages.find]
include = ["geo_radar*"]

[tool.setuptools.package-data]
geo_radar = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
