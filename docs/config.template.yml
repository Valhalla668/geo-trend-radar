# 连接信息合并进插件 config（与 platforms 同级）。
# 口令不写在这里：用 .env 或环境变量，见 geo_db action=env。
# 两个实例可单独启用；表名/字段名按现有表改 mapping，或用 sql.claims / sql.sku 覆盖查询。
# 连接信息写在插件 config；口令不要写在这里，见 .env（geo_db action=env）
databases:
  evidence:
    enabled: true
    host: 10.0.0.10
    port: 5432
    database: geo_evidence
    user: geo_readonly
    # 口令来源：默认读 GEO_EVIDENCE_PASSWORD（环境变量优先，其次 .env）
    passwordEnv: GEO_EVIDENCE_PASSWORD
    ssl: false
    schema: public
    connectTimeoutMs: 5000
    statementTimeoutMs: 8000
    maxRows: 200
    # 表名与字段名全部可配；下面是我建议的结构，按你们现有表改这里即可
    mapping:
      tables:
        claim: geo_claim
        evidence: geo_evidence
      columns:
        claim:
          claim_id: claim_id
          sku_code: sku_code
          claim_text: claim_text
          limitations: limitations
          status: status
          approved_at: approved_at
        evidence:
          evidence_id: evidence_id
          claim_id: claim_id
          grade: grade
          source: source
          source_url: source_url
          tested_at: tested_at
          valid_until: valid_until
          sample_size: sample_size
          method: method
  product:
    enabled: true
    host: 10.0.0.11
    port: 5432
    database: geo_product
    user: geo_readonly
    passwordEnv: GEO_PRODUCT_PASSWORD
    ssl: false
    schema: public
    mapping:
      tables:
        sku: geo_sku
      columns:
        sku:
          sku_code: sku_code
          product_name: product_name
          brand: brand
          category: category
          spec: spec
          price_cny: price_cny
          price_updated: price_updated
          shelf: shelf
          skin_types: skin_types
          filing_no: filing_no
          launched_at: launched_at
          status: status
